name: AAi v0 checks

on:
  push:
    branches:
      - fix/aai-v0-progress-plain-language-20261102
  pull_request:
    branches:
      - design/aai-crystal-refresh

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check public/assets/js/app.js
      - run: npx wrangler deploy --dry-run
      - name: Check Cloudflare deployment access (no secrets printed)
        env:
          AAI_CF_DEPLOY_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$AAI_CF_DEPLOY_TOKEN_SET" = "true" ]; then
            echo "::notice::Cloudflare deployment token is configured."
          else
            echo "::warning::Cloudflare deployment token is missing from GitHub Actions secrets."
          fi

  deploy-aai-v0:
    name: Deploy AAi v0 (one-time fix branch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/aai-v0-progress-plain-language-20261102'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 98bb20c5c760a9cc29971f6457ab219d
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cloudflare deploy token is missing."
            exit 1
          fi
          npx wrangler deploy --keep-vars
