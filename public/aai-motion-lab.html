<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AAi Pendamping — Laboratorium Gerak QA</title>
  <link rel="stylesheet" href="/assets/css/aai-companion.css">
  <style>
    :root{color-scheme:light}
    body{margin:0;min-height:100svh;display:flex;flex-direction:column;align-items:center;background:#f4f0ff;color:#42345c;font:500 15px/1.5 system-ui,sans-serif}
    main{max-width:520px;width:100%;padding:20px;box-sizing:border-box}
    h1{font-size:20px;margin:0 0 4px}
    p{margin:0 0 16px;color:#776995;font-size:13px}
    #aaiCompanionStage{height:400px;border:1px solid #d8cdef;border-radius:24px;overflow:hidden;background:linear-gradient(#fff,#f6f1ff)}
    #aaiCompanionWidget{position:absolute;top:50px;left:calc(50% - 130px);width:260px}
    #aaiCompanionMascot{width:245px;height:260px}
    #aaiCompanionMascot img{width:100%;height:100%;object-fit:contain}
    nav{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}
    nav button{border:1px solid #c7b5e8;border-radius:999px;background:#fff;color:#4b3a75;font:600 13px system-ui;padding:9px 13px;cursor:pointer}
    nav button:focus-visible{outline:3px solid #735ac9}
    #motionStatus{font-weight:600;font-size:13px;color:#604f92}
    footer{font-size:12px;color:#776995;padding-bottom:12px}
  </style>
</head>
<body class="aai-companion-active">
  <main>
    <h1>AAi Pendamping — uji animasi</h1>
    <p>Hanya pose dan gerak, tanpa akun, chat, atau akses database. Gambar master asli tetap menjadi acuan.</p>
    <section id="aaiCompanionStage" class="aai-companion-stage" aria-label="Pratinjau AAi">
      <div id="aaiCompanionWidget" class="aai-companion-widget">
        <div id="aaiCompanionMascot" class="aai-companion-mascot" tabindex="0" aria-label="Karakter AAi">
          <img src="/aai-mascot-studio.png" alt="AAi Pendamping">
        </div>
      </div>
    </section>
    <nav aria-label="Pilih animasi">
      <button type="button" data-action="sleep">Tidur</button>
      <button type="button" data-action="wake">Bangun</button>
      <button type="button" data-action="think">Berpikir</button>
      <button type="button" data-action="talk">Berbicara</button>
      <button type="button" data-action="shy">Malu</button>
      <button type="button" data-action="fly">Terbang</button>
      <button type="button" data-action="idle">Rileks</button>
    </nav>
    <div id="motionStatus" role="status" aria-live="polite">Memuat gerak...</div>
  </main>
  <footer>Halaman QA visual pada cabang Preview. Tidak terhubung ke chat produksi.</footer>
  <script src="/assets/js/aai-companion-motion-core.js"></script>
  <script src="/assets/js/aai-companion-motion.js"></script>
  <script>
    const labels={sleep:'Tidur',wake:'Bangun',think:'Berpikir',talk:'Berbicara',shy:'Malu',fly:'Terbang',idle:'Rileks'};
    function move(name){
      const motion=window.AAiCompanionMotion;
      if(!motion)return;
      if(name==='sleep')motion.sleep();
      else if(name==='wake')motion.wake();
      else if(name==='think')motion.activity('begin');
      else if(name==='talk')motion.activity('token');
      else if(name==='shy')motion.react('head');
      else if(name==='fly')motion.fly();
      else motion.activity('error');
      document.getElementById('motionStatus').textContent='Gerakan: '+labels[name];
    }
    document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.action)));
  </script>
</body>
</html>
