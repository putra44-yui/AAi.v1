<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f5ff">
<title>AAi ✦ Menunggu Koneksi</title>
<link rel="icon" type="image/png" href="/icons/aai-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#514173}
body{min-height:100dvh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 10% 10%,#def9ff 0,transparent 42%),radial-gradient(circle at 95% 94%,#ffe5f3 0,transparent 46%),#f8f5ff}
main{width:min(450px,100%);padding:36px 30px 34px;text-align:center;border:1px solid #fff;background:rgba(255,255,255,.88);border-radius:30px;box-shadow:0 19px 64px rgba(99,77,157,.12)}
img{width:175px;height:175px;object-fit:contain;filter:drop-shadow(0 12px 16px rgba(101,77,153,.15))}
.badge{display:inline-block;padding:8px 13px;border-radius:999px;background:#f3eaff;color:#8470bd;font-size:11px;font-weight:800;letter-spacing:1px}
h1{font-size:clamp(26px,6vw,34px);line-height:1.2;letter-spacing:-1px;margin:18px 0 13px;color:#5a478d}
p{font-size:14px;line-height:1.8;color:#8d80aa;margin:0 auto 25px;max-width:325px}
button,a{display:inline-flex;align-items:center;justify-content:center;min-height:47px;padding:12px 23px;border-radius:14px;font:700 13px system-ui;cursor:pointer;text-decoration:none}
button{background:linear-gradient(110deg,#8d74e9,#69bdf0);color:#fff;border:0;box-shadow:0 7px 18px rgba(110,95,195,.16)}
a{display:block;margin-top:12px;color:#7864b5;font-size:12px}
small{display:block;margin-top:20px;color:#a89cbb;font-size:11px}
</style>
</head>
<body>
<main>
<img src="/icons/aai-512.png" alt="Maskot AAi dengan kristal bertuliskan AAi">
<div><span class="badge">AAi • SEBENTAR YA</span></div>
<h1>Kita tunggu koneksinya ♡</h1>
<p>AAi masih di sini, tapi untuk mengobrol dengan model online kita perlu internet. Coba sambungkan perangkatmu, lalu lanjutkan percakapan.</p>
<button type="button" onclick="location.reload()">Coba lagi</button>
<a href="/">Kembali ke ruang AAi</a>
<small>Ayaka &amp; Ayato AI · Tetap semangat, ya!</small>
</main>
</body>
</html>
